table:
  name: user
  schema: public
array_relationships:
  - name: comments
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: comment
          schema: public
  - name: friends_received
    using:
      foreign_key_constraint_on:
        column: friend_id
        table:
          name: friend
          schema: public
  - name: friends_sent
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: friend
          schema: public
  - name: posts
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: post
          schema: public
  - name: stories
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: story
          schema: public
