query GetStoryById($id: Int!) {
  story_by_pk(id: $id) {
    id
    user_id
    media_url
    media_type
    created_at
    expires_at
  }
}

query GetStoriesForUsers($user_ids: [Int!]!, $now: timestamptz!) {
  story(where: {user_id: {_in: $user_ids}, expires_at: {_gt: $now}}, order_by: {created_at: desc}) {
    id
    user_id
    media_url
    media_type
    created_at
    expires_at
  }
}

mutation CreateStory($user_id: Int!, $media_url: String!, $media_type: String!) {
  insert_story_one(
    object: {
      user_id: $user_id
      media_url: $media_url
      media_type: $media_type
    }
  ) {
    id
    user_id
    media_url
    media_type
    created_at
    expires_at
  }
}

mutation DeleteStory($id: Int!) {
  delete_story_by_pk(id: $id) {
    id
  }
}

mutation DeleteExpiredStories($now: timestamptz!) {
  delete_story(where: {expires_at: {_lt: $now}}) {
    affected_rows
  }
}

